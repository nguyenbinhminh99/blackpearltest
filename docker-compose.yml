services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos_etl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_etl"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pos:pos@db:5432/pos_etl?schema=public
      PORT: 3000
      AUTO_IMPORT: "1"
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
