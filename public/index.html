<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Pearl — Báo cáo doanh thu POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1714;
      --muted: #5c534a;
      --paper: #f7f1e8;
      --panel: rgba(255, 252, 247, 0.88);
      --line: #d9cfc2;
      --accent: #0f6b4c;
      --accent-2: #c45c26;
      --danger: #9b2c2c;
      --shadow: 0 18px 50px rgba(26, 23, 20, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Be Vietnam Pro", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(15, 107, 76, 0.12), transparent 42%),
        radial-gradient(circle at 88% 8%, rgba(196, 92, 38, 0.14), transparent 36%),
        linear-gradient(160deg, #fbf7f0 0%, #efe5d7 55%, #e8f0ea 100%);
    }

    .wrap {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .brand {
      font-family: Fraunces, serif;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
      margin: 0;
    }

    .lead {
      margin: 0;
      max-width: 42rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) auto auto;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      margin-bottom: 1.25rem;
      align-items: end;
    }

    label {
      display: grid;
      gap: 0.35rem;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 500;
    }

    select, input, button {
      font: inherit;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      color: var(--ink);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0.78rem 1.1rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: 0.65; cursor: wait; }

    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .export-note {
      margin: -0.5rem 0 1rem;
      min-height: 1.25rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .export-note.ok { color: var(--accent); }
    .export-note.err { color: var(--danger); }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tab {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      font-weight: 500;
    }

    .tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .summary {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.55);
    }

    .summary strong {
      display: block;
      font-size: 1.25rem;
      margin-top: 0.15rem;
    }

    .summary span { color: var(--muted); font-size: 0.85rem; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      text-align: left;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: rgba(255,255,255,0.45);
    }

    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .danger { color: var(--danger); }
    .empty { padding: 2rem 1rem; color: var(--muted); }

    @media (max-width: 860px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }
      .actions {
        grid-column: 1 / -1;
      }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">Black Pearl</h1>
      <p class="lead">Báo cáo doanh thu POS theo ngày Việt Nam (UTC+7). Lọc theo cửa hàng và khoảng ngày, xem thêm cảnh báo thiếu dữ liệu, đối soát tổng tiền và bản ghi bị loại.</p>
    </header>

    <section class="filters">
      <label>Cửa hàng
        <select id="store"></select>
      </label>
      <label>Từ ngày
        <input id="from" type="date" value="2026-09-01" />
      </label>
      <label>Đến ngày
        <input id="to" type="date" value="2026-09-07" />
      </label>
      <div class="actions">
        <button id="reload" type="button">Áp dụng lọc</button>
        <button id="export-current" class="btn-secondary" type="button">Xuất CSV tab này</button>
        <button id="export-all" class="btn-secondary" type="button">Xuất tất cả CSV</button>
      </div>
    </section>
    <p class="export-note" id="export-note"></p>

    <div class="tabs">
      <button class="tab active" data-tab="revenue" type="button">Doanh thu</button>
      <button class="tab" data-tab="missing" type="button">Thiếu dữ liệu</button>
      <button class="tab" data-tab="reconcile" type="button">Đối soát</button>
      <button class="tab" data-tab="rejected" type="button">Bản ghi bị loại</button>
    </div>

    <section class="panel">
      <div class="summary" id="summary"></div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const state = { tab: 'revenue' };

    const money = (n) => new Intl.NumberFormat('vi-VN').format(n) + ' đ';
    const qs = () => {
      const params = new URLSearchParams();
      const store = document.getElementById('store').value;
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      if (store) params.set('store_id', store);
      if (from) params.set('from', from);
      if (to) params.set('to', to);
      return params.toString();
    };

    async function loadStores() {
      const stores = await fetch('/reports/stores').then((r) => r.json());
      const select = document.getElementById('store');
      select.innerHTML = '<option value="">Tất cả</option>' +
        stores.map((s) => `<option value="${s}">${s}</option>`).join('');
    }

    function setActiveTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.tab').forEach((el) => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
    }

    async function load() {
      const query = qs();
      if (state.tab === 'revenue') {
        const data = await fetch('/reports/revenue?' + query).then((r) => r.json());
        document.getElementById('summary').innerHTML =
          `<div><span>Số đơn completed</span><strong>${data.totals.orderCount}</strong></div>` +
          `<div><span>Tổng doanh thu</span><strong>${money(data.totals.revenue)}</strong></div>`;
        document.getElementById('thead').innerHTML =
          '<tr><th>Cửa hàng</th><th>Ngày (VN)</th><th class="num">Số đơn</th><th class="num">Doanh thu</th></tr>';
        document.getElementById('tbody').innerHTML = data.rows.length
          ? data.rows.map((row) =>
              `<tr><td>${row.storeId}</td><td>${row.date}</td><td class="num">${row.orderCount}</td><td class="num">${money(row.revenue)}</td></tr>`
            ).join('') +
            `<tr><td><strong>TOTAL</strong></td><td></td><td class="num"><strong>${data.totals.orderCount}</strong></td><td class="num"><strong>${money(data.totals.revenue)}</strong></td></tr>`
          : '<tr><td class="empty" colspan="4">Không có dữ liệu</td></tr>';
        return;
      }

      if (state.tab === 'missing') {
        const rows = await fetch('/reports/missing?' + query).then((r) => r.json());
        document.getElementById('summary').innerHTML =
          `<div><span>Số cảnh báo</span><strong>${rows.length}</strong></div>`;
        document.getElementById('thead').innerHTML =
          '<tr><th>Cửa hàng</th><th>Ngày (VN)</th><th>Lý do</th></tr>';
        document.getElementById('tbody').innerHTML = rows.length
          ? rows.map((row) =>
              `<tr><td>${row.storeId}</td><td>${row.date}</td><td>${row.reason}</td></tr>`
            ).join('')
          : '<tr><td class="empty" colspan="3">Không thiếu dữ liệu trong khoảng lọc</td></tr>';
        return;
      }

      if (state.tab === 'reconcile') {
        const rows = await fetch('/reports/reconcile?' + query).then((r) => r.json());
        document.getElementById('summary').innerHTML =
          `<div><span>Đơn lệch tổng</span><strong class="danger">${rows.length}</strong></div>`;
        document.getElementById('thead').innerHTML =
          '<tr><th>Order</th><th>Cửa hàng</th><th>Ngày</th><th class="num">POS</th><th class="num">Tính lại</th><th class="num">Chênh</th></tr>';
        document.getElementById('tbody').innerHTML = rows.length
          ? rows.map((row) =>
              `<tr><td>${row.orderId}</td><td>${row.storeId}</td><td>${row.createdAtVnDate}</td><td class="num">${money(row.totalAmount)}</td><td class="num">${money(row.calculatedTotal)}</td><td class="num danger">${money(row.difference)}</td></tr>`
            ).join('')
          : '<tr><td class="empty" colspan="6">Không có đơn lệch</td></tr>';
        return;
      }

      const rows = await fetch('/reports/rejected').then((r) => r.json());
      document.getElementById('summary').innerHTML =
        `<div><span>Bản ghi bị loại</span><strong class="danger">${rows.length}</strong></div>`;
      document.getElementById('thead').innerHTML =
        '<tr><th>Batch</th><th>Dòng</th><th>Order</th><th>Lý do</th></tr>';
      document.getElementById('tbody').innerHTML = rows.length
        ? rows.map((row) =>
            `<tr><td>${row.batchName}</td><td>${row.rowIndex}</td><td>${row.orderId ?? ''}</td><td class="danger">${row.reason}</td></tr>`
          ).join('')
        : '<tr><td class="empty" colspan="4">Không có bản ghi bị loại</td></tr>';
    }

    document.querySelectorAll('.tab').forEach((el) => {
      el.addEventListener('click', async () => {
        setActiveTab(el.dataset.tab);
        await load();
      });
    });
    document.getElementById('reload').addEventListener('click', load);

    function setExportNote(text, kind) {
      const note = document.getElementById('export-note');
      note.textContent = text;
      note.className = 'export-note' + (kind ? ' ' + kind : '');
    }

    function downloadCsv(type) {
      const url = '/reports/csv?type=' + encodeURIComponent(type) + '&' + qs();
      const link = document.createElement('a');
      link.href = url;
      link.download = '';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    document.getElementById('export-current').addEventListener('click', () => {
      downloadCsv(state.tab);
      setExportNote('Đã tải CSV cho tab hiện tại (theo bộ lọc).', 'ok');
    });

    document.getElementById('export-all').addEventListener('click', async () => {
      const btn = document.getElementById('export-all');
      btn.disabled = true;
      setExportNote('Đang tải 4 file CSV...', '');
      try {
        for (const type of ['revenue', 'missing', 'reconcile', 'rejected']) {
          downloadCsv(type);
          await new Promise((resolve) => setTimeout(resolve, 350));
        }
        setExportNote('Đã tải đủ 4 file CSV (theo bộ lọc hiện tại).', 'ok');
      } catch (error) {
        setExportNote('Xuất CSV thất bại. Thử lại giúp.', 'err');
      } finally {
        btn.disabled = false;
      }
    });

    loadStores().then(load);
  </script>
</body>
</html>
